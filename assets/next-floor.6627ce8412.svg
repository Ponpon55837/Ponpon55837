<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="136" viewBox="0 0 1080 136" role="img" aria-labelledby="title desc">
<title id="title">Always a learner. Always one floor up.</title><desc id="desc">Original Upfloor nightshift artwork in teal and amber.</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#89b5b7" stroke-opacity=".045"/></pattern></defs>
<style>.signal{animation:breathe 4s ease-in-out infinite}.window{animation:breathe 7s ease-in-out infinite}.cursor{animation:blink 1.5s steps(2,end) infinite}@keyframes breathe{50%{opacity:.4}}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){.signal,.window,.cursor{animation:none}}</style>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="1078" height="134" fill="#0c151c" rx="16" stroke="#29414b"/><rect x="2" y="2" width="1076" height="132" fill="url(#grid)" rx="15"/><g transform="translate(32 39)"><rect x="0" y="36" width="12" height="20" fill="#ffc16e" /><rect x="16" y="24" width="12" height="32" fill="#ffc16e" /><rect x="32" y="12" width="12" height="44" fill="#ffc16e" /><rect x="48" y="0" width="12" height="56" fill="#ffc16e" /></g><text x="122" y="60" font-size="25" fill="#edf4ee" font-weight="600">Always a learner.</text><text x="122" y="94" font-size="25" fill="#ffc16e" font-weight="600">Always one floor up.</text><text x="1048" y="76" font-size="14" fill="#9eb1b5" font-family="Consolas, monospace" text-anchor="end">UPFLOOR / PONPON55837</text></g></svg>
