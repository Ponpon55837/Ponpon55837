<svg xmlns="http://www.w3.org/2000/svg" width="600" height="152" viewBox="0 0 600 152" role="img" aria-labelledby="title desc">
<title id="title">Agent Pets: A desktop companion that shows what your AI coding agents are doing.</title><desc id="desc">Original Upfloor nightshift artwork in teal and amber.</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#89b5b7" stroke-opacity=".045"/></pattern></defs>
<style>.signal{animation:breathe 4s ease-in-out infinite}.window{animation:breathe 7s ease-in-out infinite}.cursor{animation:blink 1.5s steps(2,end) infinite}@keyframes breathe{50%{opacity:.4}}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){.signal,.window,.cursor{animation:none}}</style>
<g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="598" height="150" fill="#0c151c" rx="16" stroke="#29414b"/><rect x="2" y="2" width="596" height="148" fill="url(#grid)" rx="15"/><rect x="1" y="18" width="3" height="116" fill="#ffc16e" /><g transform="translate(20 46) scale(.6)"><rect x="0" y="0" width="88" height="88" fill="#101e27" rx="10" stroke="#29414b"/><g transform="translate(21 24) scale(3)" shape-rendering="crispEdges"><path d="M0 4V0h3v3h5V0h3v4h2v7h-2v4H1v-4h-3V7h2Z" fill="#ffc16e"/><rect x="1" y="6" width="2" height="2" fill="#0c151c" /><rect x="8" y="6" width="2" height="2" fill="#0c151c" /><rect x="4" y="10" width="2" height="1" fill="#0c151c" /></g></g><text x="92" y="42" font-size="28" fill="#edf4ee" font-weight="700">Agent Pets</text><text x="92" y="84" font-size="22" fill="#9eb1b5" >A desktop companion</text><text x="92" y="114" font-size="22" fill="#9eb1b5" >for your AI coding agents.</text><text x="574" y="40" font-size="24" fill="#ffc16e" text-anchor="end">↗</text></g></svg>
