<svg xmlns="http://www.w3.org/2000/svg" width="600" height="108" viewBox="0 0 600 108" role="img" aria-labelledby="title desc">
<title id="title">Work Intelligence: Local-first work memory. Sessions, decisions, and reports in one place.</title><desc id="desc">Original Upfloor nightshift artwork in teal and amber.</desc>
